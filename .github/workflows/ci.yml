name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile
        run: python -m py_compile dashboard.py palo_ua_tracker.py run_dashboard.py sentry_ua/*.py scripts/*.py
      - name: Lint (pyflakes)
        run: python -m pyflakes dashboard.py palo_ua_tracker.py run_dashboard.py sentry_ua scripts tests
      - name: Tests
        run: python -m pytest -ra

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the dashboard health endpoint
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Send one synthetic syslog packet and check it was stored
        run: |
          python3 - <<'PY'
          import socket, sys
          sys.path.insert(0, ".")
          from sentry_ua.demo import build_url_log
          sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          sock.sendto(build_url_log(user_agent="ci-smoke/1.0"), ("127.0.0.1", 1514))
          PY
          for i in $(seq 1 15); do
            count=$(docker compose exec -T collector python -c "import sqlite3; print(sqlite3.connect('/data/user_agents.db').execute(\"SELECT COUNT(*) FROM user_agents WHERE user_agent = 'ci-smoke/1.0'\").fetchone()[0])" 2>/dev/null || echo 0)
            if [ "$count" = "1" ]; then echo "stored"; exit 0; fi
            sleep 1
          done
          docker compose logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v
