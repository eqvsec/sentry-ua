# Weekly update PRs for Python dependencies, the Actions used in CI, and the
# Docker base image. Each PR runs the full CI workflow before it can merge.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Only touch a requirement when a new release falls OUTSIDE its range
    # (i.e. a new major version to vet). The default strategy raises every
    # minimum to the latest release, which would silently drop support for
    # older Pythons (e.g. pandas>=3 needs Python 3.11+, but CI tests 3.10).
    versioning-strategy: increase-if-necessary
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
